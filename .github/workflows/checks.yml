name: Component checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Lint
        run: npm run lint
      - name: Typecheck and build application
        run: npm run build
      - name: Run light and dark component checks with coverage
        run: npm run test:storybook:coverage
      - name: Build Storybook
        run: npm run build-storybook -- --disable-telemetry
      - name: Save shareable Storybook build
        uses: actions/upload-artifact@v7
        with:
          name: storybook-site
          path: storybook-static
          retention-days: 7
          if-no-files-found: error
      - name: Save coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: component-coverage
          path: coverage
          retention-days: 7
          if-no-files-found: ignore
